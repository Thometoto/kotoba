<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogue · Kotoba</title><link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}"></head><body>
<header class="topbar"><a href="{{ url_for('index') }}">Kotoba</a><a href="{{ url_for('index') }}">← Accueil</a></header><main class="catalog-page"><h1>Catalogue</h1><p>{{ ready_count }} fiches prêtes sur {{ cards|length }} kanji.</p><section class="catalog-list">
{% for card in cards %}<article class="catalog-row {{ '' if card.ready else 'pending' }}"><span>{{ card.character }}</span><div><strong>{{ card.meaning or 'À enrichir' }}</strong><small>{{ card.readings or 'Lectures et exemples à ajouter' }}</small></div><em>{{ 'Prêt' if card.ready else 'En attente' }}</em></article>{% endfor %}</section></main></body></html>
