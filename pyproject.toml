[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kotoba"
version = "0.1.0"
description = "Application personnelle de flashcards japonaises"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["flask>=3.0", "fsrs>=6.1,<7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kotoba = "webapp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["webapp", "scheduler", "config"]
